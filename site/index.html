<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ポートフォリオ</title>
<meta name="description" content="つくったサービスとWeb制作をまとめています。">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
  <symbol id="iGear" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9.4 4a7.5 7.5 0 01-.1 1.2l2 1.6-2 3.4-2.4-1a7.6 7.6 0 01-2 1.2l-.4 2.6h-4l-.4-2.6a7.6 7.6 0 01-2-1.2l-2.4 1-2-3.4 2-1.6A7.5 7.5 0 012.6 12c0-.4 0-.8.1-1.2l-2-1.6 2-3.4 2.4 1a7.6 7.6 0 012-1.2l.4-2.6h4l.4 2.6c.7.3 1.4.7 2 1.2l2.4-1 2 3.4-2 1.6c.1.4.1.8.1 1.2z"/></symbol>
</defs></svg>

<div class="stage">
  <canvas id="patternCanvas"></canvas>

  <div class="lead">
    <div>
      <p class="lead__en">
        I'm a Web / Application Developer based in Tokyo.
        <span class="lead__jp">東京でWebとアプリケーションをつくっています。</span>
      </p>
      <a class="lead__btn" href="works.html"><span>View works</span></a>
    </div>
  </div>

  <div class="chrome">
    <a class="logo" href="index.html"><span class="logo__mark"></span><span>yourname</span></a>
    <nav class="nav">
      <a class="nav__link is-current" href="index.html">トップ</a>
      <a class="nav__link" href="works.html">作品</a>
      <a class="nav__link" href="about.html">について</a>
      <button class="btnSquare" type="button" id="openSettings" aria-label="設定">
        <svg aria-hidden="true"><use href="#iGear"/></svg><span>設定</span>
      </button>
    </nav>
  </div>
</div>

<div class="settings" id="settings">
  <div class="settings__veil" data-close-settings></div>
  <div class="settings__box" role="dialog" aria-modal="true" aria-label="設定">
    <div class="settings__head">
      <h2 class="settings__title">Settings</h2>
      <button class="settings__close" type="button" data-close-settings aria-label="閉じる"></button>
    </div>
    <div class="settings__body">
      <div class="field">
        <p class="field__name">Color scheme</p>
        <div class="seg" data-key="theme">
          <span class="seg__mark"></span>
          <button class="seg__item" type="button" data-value="auto"><span class="seg__label">Auto</span></button>
          <button class="seg__item" type="button" data-value="light"><span class="seg__label">Light</span></button>
          <button class="seg__item" type="button" data-value="dark"><span class="seg__label">Dark</span></button>
        </div>
        <p class="field__note">Auto はOSの設定に合わせます。</p>
      </div>
      <div class="field">
        <p class="field__name">Motion</p>
        <div class="seg" data-key="motion">
          <span class="seg__mark"></span>
          <button class="seg__item" type="button" data-value="on"><span class="seg__label">On</span></button>
          <button class="seg__item" type="button" data-value="off"><span class="seg__label">Off</span></button>
        </div>
        <p class="field__note">背景の動きを止めます。</p>
      </div>
    </div>
  </div>
</div>

<script src="data/works.js"></script>
<script src="assets/js/pattern.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
